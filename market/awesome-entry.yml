  zh: '在 DeepSeek Harness 里加一枚可拖动的 Bingo 按钮：松手吸附最近边缘并记住位置；在面板里一键重启整个桌面端；运行期间检测到新装插件时，弹出居中对话框询问是否立即重启。'
